<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* Orca injects its design tokens as CSS custom properties. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        border-bottom: 1px solid var(--border, #444);
        position: sticky;
        top: 0;
        background: var(--background, #1e1e1e);
      }
      .tab {
        padding: 5px 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--muted-foreground, #999);
        font: inherit;
        cursor: pointer;
      }
      .tab[aria-selected='true'] {
        color: var(--foreground, #ddd);
        border-bottom-color: var(--foreground, #ddd);
      }
      .count {
        margin-left: 4px;
        padding: 0 5px;
        border-radius: 8px;
        background: var(--muted, #333);
        font-size: 10px;
      }
      main { padding: 8px 12px 16px; }
      .empty { color: var(--muted-foreground, #999); padding: 16px 0; line-height: 1.5; }
      .session { margin-bottom: 14px; }
      .session-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        color: var(--muted-foreground, #999);
        font-size: 11px;
      }
      .session-title {
        color: var(--foreground, #ddd);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #888; }
      .dot.working, .dot.running { background: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
      .dot.idle, .dot.completed { background: #22c55e; }
      .dot.failed { background: var(--destructive, #ef4444); }
      .dot.ended, .dot.aborted { background: #6b7280; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .phase { margin: 8px 0 4px; font-weight: 600; font-size: 11px; }
      .phase .progress { color: var(--muted-foreground, #999); font-weight: normal; margin-left: 4px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li.task { display: flex; gap: 6px; padding: 2px 0; line-height: 1.45; }
      .mark { flex: none; width: 14px; text-align: center; }
      .task.completed .text, .task.abandoned .text {
        color: var(--muted-foreground, #999);
        text-decoration: line-through;
      }
      .task.in_progress .text { font-weight: 600; }
      .task.in_progress .mark { color: #3b82f6; }
      .task.completed .mark { color: #22c55e; }
      .task.blocked .mark { color: #f59e0b; }
      .blocker { display: block; color: #f59e0b; font-size: 11px; }
      li.sub {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 2px 6px;
        align-items: center;
        padding: 5px 0;
        border-bottom: 1px solid var(--border, #333);
      }
      .sub-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub-time { color: var(--muted-foreground, #999); font-variant-numeric: tabular-nums; }
      .sub-desc, .sub-meta {
        grid-column: 2 / 4;
        color: var(--muted-foreground, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="todos" aria-selected="true">
        Todos<span class="count" id="count-todos">0</span>
      </button>
      <button class="tab" role="tab" data-tab="subagents" aria-selected="false">
        Subagents<span class="count" id="count-subagents">0</span>
      </button>
    </nav>
    <main id="content"></main>
    <script>
      'use strict'
      var CONTEXT_POLL_MS = 1500
      var MARKS = { pending: '○', in_progress: '◐', completed: '✓', abandoned: '✕', blocked: '⊘' }

      var state = { tab: 'todos', worktreeId: undefined, contextError: null, snapshot: null }
      var content = document.getElementById('content')
      var seq = 0
      var pending = {}

      function el(tag, className, text) {
        var node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined && text !== null) node.textContent = String(text)
        return node
      }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return
        var data = event.data
        if (!data) return
        if (data.type === 'orca-panel-action-result') {
          var resolve = pending[data.requestId]
          if (resolve) {
            delete pending[data.requestId]
            resolve(data)
          }
          return
        }
        if (data.type === 'orca-panel-data') {
          state.snapshot = data.data
          render()
        }
      })

      function pollContext() {
        call('workspace.readContext').then(function (result) {
          var next = result.ok ? (result.value ? result.value.worktreeId : null) : undefined
          var error = result.ok ? null : result.error || result.errorCode
          if (next !== state.worktreeId || error !== state.contextError) {
            state.worktreeId = next
            state.contextError = error
            render()
          }
        })
      }

      function visibleSessions() {
        var sessions = (state.snapshot && state.snapshot.sessions) || []
        return sessions.filter(function (session) {
          return state.worktreeId && session.worktreeId === state.worktreeId
        })
      }

      function duration(ms) {
        var s = Math.max(0, Math.floor(ms / 1000))
        if (s < 60) return s + 's'
        var m = Math.floor(s / 60)
        if (m < 60) return m + 'm ' + (s % 60) + 's'
        return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
      }

      function sessionHead(session) {
        var head = el('div', 'session-head')
        head.appendChild(el('span', 'dot ' + session.status))
        head.appendChild(el('span', 'session-title', session.title || session.sessionId.slice(0, 8)))
        head.appendChild(el('span', null, session.status))
        return head
      }

      function renderTodos(session) {
        var box = el('section', 'session')
        box.appendChild(sessionHead(session))
        if (!session.todoPhases.length) {
          box.appendChild(el('div', 'empty', 'No todos yet.'))
          return box
        }
        session.todoPhases.forEach(function (phase) {
          var done = phase.tasks.filter(function (task) {
            return task.status === 'completed' || task.status === 'abandoned'
          }).length
          var title = el('div', 'phase', phase.name)
          title.appendChild(el('span', 'progress', done + '/' + phase.tasks.length))
          box.appendChild(title)
          var list = el('ul')
          phase.tasks.forEach(function (task) {
            var item = el('li', 'task ' + task.status)
            item.appendChild(el('span', 'mark', MARKS[task.status] || '?'))
            var text = el('span', 'text', task.content)
            if (task.blocker) text.appendChild(el('span', 'blocker', 'Blocked: ' + task.blocker))
            item.appendChild(text)
            list.appendChild(item)
          })
          box.appendChild(list)
        })
        return box
      }

      function renderSubagents(session, now) {
        var box = el('section', 'session')
        box.appendChild(sessionHead(session))
        if (!session.subagents.length) {
          box.appendChild(el('div', 'empty', 'No subagents in this session.'))
          return box
        }
        var list = el('ul')
        // Running first, then most recently started.
        var subs = session.subagents.slice().sort(function (a, b) {
          var ra = a.status === 'running' ? 0 : 1
          var rb = b.status === 'running' ? 0 : 1
          return ra - rb || (b.startedAt || 0) - (a.startedAt || 0)
        })
        subs.forEach(function (sub) {
          var item = el('li', 'sub')
          item.appendChild(el('span', 'dot ' + sub.status))
          item.appendChild(el('span', 'sub-name', sub.id || sub.agent))
          var elapsed = sub.startedAt ? (sub.endedAt || now) - sub.startedAt : null
          item.appendChild(el('span', 'sub-time', elapsed === null ? '' : duration(elapsed)))
          if (sub.description) item.appendChild(el('span', 'sub-desc', sub.description))
          var meta = [sub.agent, sub.status, sub.model].filter(Boolean).join(' · ')
          item.appendChild(el('span', 'sub-meta', meta))
          list.appendChild(item)
        })
        box.appendChild(list)
        return box
      }

      function render() {
        var sessions = visibleSessions()
        var openTodos = 0
        var running = 0
        sessions.forEach(function (session) {
          session.todoPhases.forEach(function (phase) {
            phase.tasks.forEach(function (task) {
              if (task.status === 'pending' || task.status === 'in_progress' || task.status === 'blocked') openTodos++
            })
          })
          session.subagents.forEach(function (sub) {
            if (sub.status === 'running') running++
          })
        })
        document.getElementById('count-todos').textContent = openTodos
        document.getElementById('count-subagents').textContent = running

        content.replaceChildren()
        if (state.contextError) {
          content.appendChild(el('div', 'empty', 'Cannot read workspace: ' + state.contextError))
          return
        }
        if (state.worktreeId === undefined || !state.snapshot) {
          content.appendChild(el('div', 'empty', 'Loading…'))
          return
        }
        if (!state.worktreeId) {
          content.appendChild(el('div', 'empty', 'No worktree focused.'))
          return
        }
        if (!sessions.length) {
          content.appendChild(
            el('div', 'empty', 'No omp session in this worktree. Start omp in an Orca terminal here.')
          )
          return
        }
        var now = Date.now()
        sessions.forEach(function (session) {
          content.appendChild(
            state.tab === 'todos' ? renderTodos(session) : renderSubagents(session, now)
          )
        })
      }

      document.querySelectorAll('.tab').forEach(function (button) {
        button.addEventListener('click', function () {
          state.tab = button.getAttribute('data-tab')
          document.querySelectorAll('.tab').forEach(function (other) {
            other.setAttribute('aria-selected', String(other === button))
          })
          render()
        })
      })

      pollContext()
      setInterval(pollContext, CONTEXT_POLL_MS)
      // Ticks running-subagent durations between data pushes.
      setInterval(function () {
        if (state.tab === 'subagents') render()
      }, 1000)
      render()
    </script>
  </body>
</html>
