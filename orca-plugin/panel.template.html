<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Template: the omp extension renders panel.html from this file with the
         live session data in place of the placeholder below. Stock Orca reloads
         a dev plugin's panel whenever panel.html changes. -->
    <style>
      /* Orca injects its design tokens as CSS custom properties. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 8px 12px 16px;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      .empty { color: var(--muted-foreground, #999); padding: 16px 0; line-height: 1.5; }
      .none { color: var(--muted-foreground, #999); padding: 2px 0 4px; }
      .todos { margin-bottom: 12px; }
      .session-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 8px 0 2px;
        color: var(--muted-foreground, #999);
        font-size: 11px;
      }
      .session-title {
        color: var(--foreground, #ddd);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #888; }
      .dot.working, .dot.running { background: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
      .dot.idle, .dot.completed { background: #22c55e; }
      .dot.failed { background: var(--destructive, #ef4444); }
      .dot.ended, .dot.aborted { background: #6b7280; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      h2 {
        margin: 10px 0 2px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground, #999);
      }
      .phase { margin: 6px 0 2px; font-weight: 600; font-size: 11px; }
      .phase .progress { color: var(--muted-foreground, #999); font-weight: normal; margin-left: 4px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li.task { display: flex; gap: 6px; padding: 2px 0; line-height: 1.45; }
      .mark { flex: none; width: 14px; text-align: center; }
      .task.completed .text, .task.abandoned .text {
        color: var(--muted-foreground, #999);
        text-decoration: line-through;
      }
      .task.in_progress .text { font-weight: 600; }
      .task.in_progress .mark { color: #3b82f6; }
      .task.completed .mark { color: #22c55e; }
      .task.blocked .mark { color: #f59e0b; }
      .blocker { display: block; color: #f59e0b; font-size: 11px; }
      li.sub {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 2px 6px;
        align-items: center;
        padding: 5px 0;
        border-bottom: 1px solid var(--border, #333);
      }
      .sub-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub-time { color: var(--muted-foreground, #999); font-variant-numeric: tabular-nums; }
      .sub-desc, .sub-meta, .sub-stats, .sub-activity, .sub-tools {
        grid-column: 2 / 4;
        color: var(--muted-foreground, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sub-activity { color: var(--foreground, #ddd); }
      .sub-activity .pct { color: #3b82f6; margin-right: 4px; font-variant-numeric: tabular-nums; }
      .sub-stats { font-variant-numeric: tabular-nums; font-size: 11px; }
      .sub-tools { font-size: 11px; }
      .sub-tools .tool { font-family: ui-monospace, monospace; color: var(--foreground, #ddd); }
      .sub-tools .error .tool, .sub-tools .error { color: var(--destructive, #ef4444); }
    </style>
  </head>
  <body>
    <main id="content"></main>
    <script>
      'use strict'
      var DATA = /*__OMP_AGENT_DATA__*/null
      var CONTEXT_POLL_MS = 1500
      var MARKS = { pending: '○', in_progress: '◐', completed: '✓', abandoned: '✕', blocked: '⊘' }

      // terminals: Set of handles in the focused worktree; undefined until the first read.
      var state = { terminals: undefined, contextError: null }
      var content = document.getElementById('content')
      var seq = 0
      var pending = {}

      function el(tag, className, text) {
        var node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined && text !== null) node.textContent = String(text)
        return node
      }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (resolve) {
          delete pending[data.requestId]
          resolve(data)
        }
      })

      // Focus changes do not reload the panel, so the worktree is polled.
      function pollContext() {
        call('workspace.readContext').then(function (result) {
          var error = result.ok ? null : result.error || result.errorCode
          var handles = result.ok && result.value
            ? result.value.terminals.map(function (t) { return t.id }).sort().join('\n')
            : ''
          var previous = state.terminals ? Array.from(state.terminals).sort().join('\n') : null
          if (handles === previous && error === state.contextError) return
          state.terminals = new Set(handles ? handles.split('\n') : [])
          state.contextError = error
          render()
        })
      }

      function duration(ms) {
        var s = Math.max(0, Math.floor(ms / 1000))
        if (s < 60) return s + 's'
        var m = Math.floor(s / 60)
        if (m < 60) return m + 'm ' + (s % 60) + 's'
        return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
      }

      function tokens(n) {
        if (n < 1000) return String(n)
        if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k'
        return (n / 1e6).toFixed(1) + 'M'
      }

      // Fields added after the first schema-v1 release are absent in older state files.
      function subStats(sub) {
        var parts = []
        if (sub.toolCount) parts.push(sub.toolCount + (sub.toolCount === 1 ? ' tool' : ' tools'))
        if (sub.requests) parts.push(sub.requests + ' req')
        if (sub.tokens) parts.push(tokens(sub.tokens) + ' tok')
        if (sub.cost) parts.push('$' + sub.cost.toFixed(2))
        if (typeof sub.contextPct === 'number') parts.push('ctx ' + sub.contextPct + '%')
        return parts.join(' · ')
      }

      function renderTodos(box, session) {
        if (!session.todoPhases.length) {
          box.appendChild(el('div', 'none', 'No todos.'))
          return
        }
        session.todoPhases.forEach(function (phase) {
          var done = phase.tasks.filter(function (task) {
            return task.status === 'completed' || task.status === 'abandoned'
          }).length
          var title = el('div', 'phase', phase.name)
          title.appendChild(el('span', 'progress', done + '/' + phase.tasks.length))
          box.appendChild(title)
          var list = el('ul')
          phase.tasks.forEach(function (task) {
            var item = el('li', 'task ' + task.status)
            item.appendChild(el('span', 'mark', MARKS[task.status] || '?'))
            var text = el('span', 'text', task.content)
            if (task.blocker) text.appendChild(el('span', 'blocker', 'Blocked: ' + task.blocker))
            item.appendChild(text)
            list.appendChild(item)
          })
          box.appendChild(list)
        })
      }

      // One list across every shown session: running first, then most recently started.
      function renderSubagents(box, sessions, now) {
        var subs = []
        sessions.forEach(function (session) {
          session.subagents.forEach(function (sub) { subs.push({ sub: sub, session: session }) })
        })
        if (!subs.length) return
        var running = subs.filter(function (entry) { return entry.sub.status === 'running' }).length
        box.appendChild(el('h2', null, 'Subagents' + (running ? ' · ' + running + ' running' : '')))
        var list = el('ul')
        subs
          .sort(function (x, y) {
            var a = x.sub
            var b = y.sub
            var ra = a.status === 'running' ? 0 : 1
            var rb = b.status === 'running' ? 0 : 1
            return ra - rb || (b.startedAt || 0) - (a.startedAt || 0)
          })
          .forEach(function (entry) {
            var sub = entry.sub
            var item = el('li', 'sub')
            item.appendChild(el('span', 'dot ' + sub.status))
            var name = el('span', 'sub-name', sub.id || sub.agent)
            if (sub.assignment) name.title = sub.assignment
            item.appendChild(name)
            var elapsed = sub.startedAt ? (sub.endedAt || now) - sub.startedAt : null
            var time = el('span', 'sub-time', elapsed === null ? '' : duration(elapsed))
            if (sub.status === 'running' && sub.startedAt) time.dataset.startedAt = String(sub.startedAt)
            item.appendChild(time)
            if (sub.description) item.appendChild(el('span', 'sub-desc', sub.description))
            if (sub.status === 'running' && (sub.activity || typeof sub.completionPct === 'number')) {
              var activity = el('span', 'sub-activity')
              if (typeof sub.completionPct === 'number') activity.appendChild(el('span', 'pct', '~' + sub.completionPct + '%'))
              if (sub.activity) {
                activity.appendChild(document.createTextNode(sub.activity))
                activity.title = sub.activity
              }
              item.appendChild(activity)
            }
            var meta = [sub.agent, sub.status, sub.model]
            // Several sessions share the list: name the owning one.
            if (sessions.length > 1) meta.unshift(sessionLabel(entry.session))
            item.appendChild(el('span', 'sub-meta', meta.filter(Boolean).join(' · ')))
            var stats = subStats(sub)
            if (stats) item.appendChild(el('span', 'sub-stats', stats))
            ;(sub.recentTools || []).forEach(function (t) {
              var line = el('span', 'sub-tools' + (t.isError ? ' error' : ''))
              line.appendChild(el('span', 'tool', (t.isError ? '✕ ' : '') + t.tool))
              if (t.text) line.appendChild(document.createTextNode(' ' + t.text))
              line.title = t.tool + (t.text ? ' ' + t.text : '')
              item.appendChild(line)
            })
            list.appendChild(item)
          })
        box.appendChild(list)
      }

      function sessionLabel(session) {
        return session.title || 'Untitled session'
      }

      function render() {
        content.replaceChildren()
        if (state.contextError) {
          content.appendChild(el('div', 'empty', 'Cannot read workspace: ' + state.contextError))
          return
        }
        // Every data update is a fresh iframe; stay blank until the first context
        // read instead of flashing a placeholder text.
        if (!state.terminals) return
        var sessions = ((DATA && DATA.sessions) || []).filter(function (session) {
          return state.terminals.has(session.terminalHandle)
        })
        if (!sessions.length) {
          content.appendChild(
            el('div', 'empty', 'No omp session in this worktree. Start omp in an Orca terminal here.')
          )
          return
        }
        var now = Date.now()
        // Todos always come first, one block per session, then a single subagent list.
        var todos = el('section', 'todos')
        todos.appendChild(el('h2', null, 'Todos'))
        sessions.forEach(function (session) {
          var head = el('div', 'session-head')
          head.appendChild(el('span', 'dot ' + session.status))
          head.appendChild(el('span', 'session-title', sessionLabel(session)))
          head.appendChild(el('span', null, session.status))
          todos.appendChild(head)
          renderTodos(todos, session)
        })
        content.appendChild(todos)
        renderSubagents(content, sessions, now)
      }

      pollContext()
      setInterval(pollContext, CONTEXT_POLL_MS)
      // Ticks running-subagent durations between reloads. Only the time text
      // changes, so hover tooltips and text selection survive the tick.
      setInterval(function () {
        var now = Date.now()
        document.querySelectorAll('.sub-time[data-started-at]').forEach(function (node) {
          node.textContent = duration(now - Number(node.dataset.startedAt))
        })
      }, 1000)
      render()
    </script>
  </body>
</html>
