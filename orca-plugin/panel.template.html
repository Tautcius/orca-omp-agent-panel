<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Template: the omp extension renders panel.html from this file with the
         live session data in place of the placeholder below. Stock Orca reloads
         a dev plugin's panel whenever panel.html changes. -->
    <style>
      /* Orca injects its design tokens as CSS custom properties. */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 8px 12px 16px;
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: var(--foreground, #ddd);
        background: var(--background, transparent);
      }
      .empty { color: var(--muted-foreground, #999); padding: 16px 0; line-height: 1.5; }
      .session { margin-bottom: 16px; }
      .session-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
        color: var(--muted-foreground, #999);
        font-size: 11px;
      }
      .session-title {
        color: var(--foreground, #ddd);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: #888; }
      .dot.working, .dot.running { background: #3b82f6; animation: pulse 1.2s ease-in-out infinite; }
      .dot.idle, .dot.completed { background: #22c55e; }
      .dot.failed { background: var(--destructive, #ef4444); }
      .dot.ended, .dot.aborted { background: #6b7280; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      h2 {
        margin: 10px 0 2px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground, #999);
      }
      .phase { margin: 6px 0 2px; font-weight: 600; font-size: 11px; }
      .phase .progress { color: var(--muted-foreground, #999); font-weight: normal; margin-left: 4px; }
      ul { list-style: none; margin: 0; padding: 0; }
      li.task { display: flex; gap: 6px; padding: 2px 0; line-height: 1.45; }
      .mark { flex: none; width: 14px; text-align: center; }
      .task.completed .text, .task.abandoned .text {
        color: var(--muted-foreground, #999);
        text-decoration: line-through;
      }
      .task.in_progress .text { font-weight: 600; }
      .task.in_progress .mark { color: #3b82f6; }
      .task.completed .mark { color: #22c55e; }
      .task.blocked .mark { color: #f59e0b; }
      .blocker { display: block; color: #f59e0b; font-size: 11px; }
      li.sub {
        display: grid;
        grid-template-columns: 10px 1fr auto;
        gap: 2px 6px;
        align-items: center;
        padding: 5px 0;
        border-bottom: 1px solid var(--border, #333);
      }
      .sub-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sub-time { color: var(--muted-foreground, #999); font-variant-numeric: tabular-nums; }
      .sub-desc, .sub-meta {
        grid-column: 2 / 4;
        color: var(--muted-foreground, #999);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main id="content"></main>
    <script>
      'use strict'
      var DATA = /*__OMP_AGENT_DATA__*/null
      var CONTEXT_POLL_MS = 1500
      var MARKS = { pending: '○', in_progress: '◐', completed: '✓', abandoned: '✕', blocked: '⊘' }

      // terminals: Set of handles in the focused worktree; undefined until the first read.
      var state = { terminals: undefined, contextError: null }
      var content = document.getElementById('content')
      var seq = 0
      var pending = {}

      function el(tag, className, text) {
        var node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined && text !== null) node.textContent = String(text)
        return node
      }

      function call(action, params) {
        return new Promise(function (resolve) {
          var requestId = 'req-' + ++seq
          pending[requestId] = resolve
          window.parent.postMessage(
            { type: 'orca-panel-action', requestId: requestId, action: action, params: params },
            '*'
          )
        })
      }

      window.addEventListener('message', function (event) {
        if (event.source !== window.parent) return
        var data = event.data
        if (!data || data.type !== 'orca-panel-action-result') return
        var resolve = pending[data.requestId]
        if (resolve) {
          delete pending[data.requestId]
          resolve(data)
        }
      })

      // Focus changes do not reload the panel, so the worktree is polled.
      function pollContext() {
        call('workspace.readContext').then(function (result) {
          var error = result.ok ? null : result.error || result.errorCode
          var handles = result.ok && result.value
            ? result.value.terminals.map(function (t) { return t.id }).sort().join('\n')
            : ''
          var previous = state.terminals ? Array.from(state.terminals).sort().join('\n') : null
          if (handles === previous && error === state.contextError) return
          state.terminals = new Set(handles ? handles.split('\n') : [])
          state.contextError = error
          render()
        })
      }

      function duration(ms) {
        var s = Math.max(0, Math.floor(ms / 1000))
        if (s < 60) return s + 's'
        var m = Math.floor(s / 60)
        if (m < 60) return m + 'm ' + (s % 60) + 's'
        return Math.floor(m / 60) + 'h ' + (m % 60) + 'm'
      }

      function renderTodos(box, session) {
        if (!session.todoPhases.length) return
        box.appendChild(el('h2', null, 'Todos'))
        session.todoPhases.forEach(function (phase) {
          var done = phase.tasks.filter(function (task) {
            return task.status === 'completed' || task.status === 'abandoned'
          }).length
          var title = el('div', 'phase', phase.name)
          title.appendChild(el('span', 'progress', done + '/' + phase.tasks.length))
          box.appendChild(title)
          var list = el('ul')
          phase.tasks.forEach(function (task) {
            var item = el('li', 'task ' + task.status)
            item.appendChild(el('span', 'mark', MARKS[task.status] || '?'))
            var text = el('span', 'text', task.content)
            if (task.blocker) text.appendChild(el('span', 'blocker', 'Blocked: ' + task.blocker))
            item.appendChild(text)
            list.appendChild(item)
          })
          box.appendChild(list)
        })
      }

      function renderSubagents(box, session, now) {
        if (!session.subagents.length) return
        box.appendChild(el('h2', null, 'Subagents'))
        var list = el('ul')
        // Running first, then most recently started.
        session.subagents
          .slice()
          .sort(function (a, b) {
            var ra = a.status === 'running' ? 0 : 1
            var rb = b.status === 'running' ? 0 : 1
            return ra - rb || (b.startedAt || 0) - (a.startedAt || 0)
          })
          .forEach(function (sub) {
            var item = el('li', 'sub')
            item.appendChild(el('span', 'dot ' + sub.status))
            item.appendChild(el('span', 'sub-name', sub.id || sub.agent))
            var elapsed = sub.startedAt ? (sub.endedAt || now) - sub.startedAt : null
            item.appendChild(el('span', 'sub-time', elapsed === null ? '' : duration(elapsed)))
            if (sub.description) item.appendChild(el('span', 'sub-desc', sub.description))
            item.appendChild(el('span', 'sub-meta', [sub.agent, sub.status, sub.model].filter(Boolean).join(' · ')))
            list.appendChild(item)
          })
        box.appendChild(list)
      }

      function render() {
        content.replaceChildren()
        if (state.contextError) {
          content.appendChild(el('div', 'empty', 'Cannot read workspace: ' + state.contextError))
          return
        }
        if (!state.terminals) {
          content.appendChild(el('div', 'empty', 'Loading…'))
          return
        }
        var sessions = ((DATA && DATA.sessions) || []).filter(function (session) {
          return state.terminals.has(session.terminalHandle)
        })
        if (!sessions.length) {
          content.appendChild(
            el('div', 'empty', 'No omp session in this worktree. Start omp in an Orca terminal here.')
          )
          return
        }
        var now = Date.now()
        sessions.forEach(function (session) {
          var box = el('section', 'session')
          var head = el('div', 'session-head')
          head.appendChild(el('span', 'dot ' + session.status))
          head.appendChild(el('span', 'session-title', session.title || session.sessionId.slice(0, 8)))
          head.appendChild(el('span', null, session.status))
          box.appendChild(head)
          renderTodos(box, session)
          renderSubagents(box, session, now)
          if (!session.todoPhases.length && !session.subagents.length) {
            box.appendChild(el('div', 'empty', 'No todos or subagents yet.'))
          }
          content.appendChild(box)
        })
      }

      pollContext()
      setInterval(pollContext, CONTEXT_POLL_MS)
      // Ticks running-subagent durations between reloads.
      setInterval(function () {
        if (state.terminals) render()
      }, 1000)
      render()
    </script>
  </body>
</html>
